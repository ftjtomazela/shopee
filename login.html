<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Tomazela Piscinas</title>
    <style>
        :root {
            --primary: #006994;
            --secondary: #00b4d8;
            --dark: #0f0f23;
            --card: #16213e;
            --danger: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: var(--card);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .login-box .emoji {
            text-align: center;
            font-size: 3.5em;
            margin-bottom: 15px;
        }

        .login-box h1 {
            text-align: center;
            color: white;
            font-size: 1.6em;
            margin-bottom: 5px;
        }

        .login-box .sub {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--secondary);
            background: rgba(255,255,255,0.08);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.05em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-login:hover {
            box-shadow: 0 8px 30px rgba(0,180,216,0.3);
        }

        .btn-register {
            background: transparent;
            color: var(--secondary);
            border: 2px solid var(--secondary);
            margin-top: 10px;
        }

        .btn-register:hover {
            background: rgba(0,180,216,0.1);
        }

        .error-msg {
            background: rgba(231,76,60,0.15);
            border: 1px solid var(--danger);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        .error-msg.show { display: block; }

        .success-msg {
            background: rgba(46,204,113,0.15);
            border: 1px solid #2ecc71;
            color: #2ecc71;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        .success-msg.show { display: block; }

        .divider {
            text-align: center;
            color: #555;
            margin: 20px 0;
            font-size: 0.85em;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link:hover { color: var(--secondary); }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="emoji">🏊‍♂️</div>
        <h1>Tomazela Piscinas</h1>
        <p class="sub">Painel de Administração</p>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <!-- FORMULÁRIO DE LOGIN -->
        <div id="loginForm">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>🔒 Senha</label>
                <input type="password" id="loginPassword" placeholder="Sua senha">
            </div>
            <button class="btn btn-login" onclick="fazerLogin()" id="btnLogin">
                🔐 Entrar
            </button>
            <div class="divider">— ou —</div>
            <button class="btn btn-register" onclick="showRegister()">
                ✨ Criar Conta
            </button>
        </div>

        <!-- FORMULÁRIO DE REGISTRO -->
        <div id="registerForm" style="display:none;">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="registerEmail" placeholder="seu@email.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>🔒 Senha (mínimo 6 caracteres)</label>
                <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="form-group">
                <label>🔒 Confirmar Senha</label>
                <input type="password" id="registerConfirmPassword" placeholder="Repita a senha">
            </div>
            <button class="btn btn-login" onclick="criarConta()" id="btnRegister">
                ✨ Criar Conta
            </button>
            <div class="divider">— ou —</div>
            <button class="btn btn-register" onclick="showLogin()">
                🔐 Já tenho conta
            </button>
        </div>

        <a href="index.html" class="back-link">← Voltar para o site</a>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from './js/firebase-config.js';

        // Verificar se já está logado
        onAuthStateChanged(auth, user => {
            if (user) {
                window.location.href = 'admin.html';
            }
        });

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = '❌ ' + msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = '✅ ' + msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        }

        window.showRegister = function() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('errorMsg').classList.remove('show');
        };

        window.showLogin = function() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('errorMsg').classList.remove('show');
        };

        window.fazerLogin = function() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            const btn = document.getElementById('btnLogin');

            if (!email || !pass) {
                showError('Preencha email e senha.');
                return;
            }

            btn.innerHTML = '<span class="spinner"></span> Entrando...';
            btn.disabled = true;

            signInWithEmailAndPassword(auth, email, pass)
                .then(() => {
                    window.location.href = 'admin.html';
                })
                .catch(error => {
                    let msg = 'Erro ao fazer login.';
                    if (error.code === 'auth/user-not-found') msg = 'Usuário não encontrado.';
                    if (error.code === 'auth/wrong-password') msg = 'Senha incorreta.';
                    if (error.code === 'auth/invalid-email') msg = 'Email inválido.';
                    if (error.code === 'auth/invalid-credential') msg = 'Email ou senha incorretos.';
                    showError(msg);
                    btn.innerHTML = '🔐 Entrar';
                    btn.disabled = false;
                });
        };

        window.criarConta = function() {
            const email = document.getElementById('registerEmail').value.trim();
            const pass = document.getElementById('registerPassword').value.trim();
            const confirmPass = document.getElementById('registerConfirmPassword').value.trim();
            const btn = document.getElementById('btnRegister');

            if (!email || !pass || !confirmPass) {
                showError('Preencha todos os campos.');
                return;
            }

            if (pass !== confirmPass) {
                showError('As senhas não conferem.');
                return;
            }

            if (pass.length < 6) {
                showError('A senha precisa ter no mínimo 6 caracteres.');
                return;
            }

            btn.innerHTML = '<span class="spinner"></span> Criando...';
            btn.disabled = true;

            createUserWithEmailAndPassword(auth, email, pass)
                .then(() => {
                    showSuccess('Conta criada! Redirecionando...');
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 1500);
                })
                .catch(error => {
                    let msg = 'Erro ao criar conta.';
                    if (error.code === 'auth/email-already-in-use') msg = 'Este email já está em uso.';
                    if (error.code === 'auth/invalid-email') msg = 'Email inválido.';
                    if (error.code === 'auth/weak-password') msg = 'Senha muito fraca (mínimo 6 caracteres).';
                    showError(msg);
                    btn.innerHTML = '✨ Criar Conta';
                    btn.disabled = false;
                });
        };

        // Enter para login
        document.addEventListener('keypress', e => {
            if (e.key === 'Enter') window.fazerLogin();
        });
    </script>
</body>
</html>
