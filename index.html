<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomazela Piscinas | Produtos para Piscina</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏊</text></svg>">
    <style>
        :root {
            --primary: #006994;
            --secondary: #00b4d8;
            --accent: #ff6b35;
            --dark: #1a1a2e;
            --white: #ffffff;
            --shadow: 0 10px 40px rgba(0,0,0,0.1);
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(160deg, #e8f4f8 0%, #cce5ff 30%, #e0f7fa 70%, #b2ebf2 100%);
            min-height: 100vh;
            color: #333;
        }

        .header-top {
            background: var(--dark);
            color: white;
            padding: 10px 0;
            font-size: 0.85em;
            text-align: center;
        }

        .header-top .discount-badge {
            background: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        header {
            background: var(--white);
            padding: 25px 20px;
            text-align: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-icon { font-size: 3em; }

        .logo-text {
            font-size: 2.2em;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            color: #666;
            font-size: 0.9em;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .social-pills {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .social-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85em;
            transition: all 0.3s;
            color: white;
        }

        .social-pill:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .pill-tiktok { background: #000; }
        .pill-tiktok:hover { background: #fe2c55; }
        .pill-whatsapp { background: #25D366; }
        .pill-whatsapp:hover { background: #128C7E; }
        .pill-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }

        .category-nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 25px 20px;
            flex-wrap: wrap;
        }

        .cat-btn {
            padding: 10px 22px;
            background: var(--white);
            border: 2px solid transparent;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .cat-btn:hover, .cat-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(0,105,148,0.3);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 50px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.4s;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        .product-media {
            width: 100%;
            height: 250px;
            background: #e8e8e8;
            position: relative;
            overflow: hidden;
        }

        .product-media img,
        .product-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-card:hover .product-media img {
            transform: scale(1.05);
        }

        .discount-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--accent);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.85em;
            z-index: 2;
        }

        .video-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            z-index: 2;
        }

        .product-body {
            padding: 20px;
        }

        .product-name {
            font-size: 1.15em;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 0.85em;
            color: #777;
            margin-bottom: 15px;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 15px;
        }

        .current-price {
            font-size: 1.6em;
            font-weight: 900;
            color: var(--accent);
        }

        .old-price {
            font-size: 0.9em;
            color: #bbb;
            text-decoration: line-through;
        }

        .btn-buy {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1em;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn-buy:hover {
            box-shadow: 0 8px 25px rgba(0,105,148,0.4);
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            grid-column: 1 / -1;
        }

        .empty-state .icon { font-size: 4em; margin-bottom: 20px; }
        .empty-state h3 { font-size: 1.3em; color: var(--dark); margin-bottom: 10px; }
        .empty-state p { color: #999; }

        .loading-spinner {
            text-align: center;
            padding: 60px;
            grid-column: 1 / -1;
            color: var(--dark);
            font-size: 1.2em;
        }

        .loading-spinner .spin {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0,105,148,0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .admin-entry {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: rgba(0,0,0,0.5);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.1em;
            z-index: 500;
            opacity: 0.4;
            transition: all 0.3s;
        }

        .admin-entry:hover { opacity: 1; transform: scale(1.1); }

        footer {
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 40px 20px;
            margin-top: 40px;
        }

        footer .footer-logo { font-size: 1.5em; font-weight: 800; margin-bottom: 10px; }
        footer p { opacity: 0.7; font-size: 0.9em; }
        footer .credits { margin-top: 15px; font-size: 0.8em; opacity: 0.5; }

        @media (max-width: 768px) {
            .logo-text { font-size: 1.5em; }
            .logo-icon { font-size: 2em; }
            .products-grid { grid-template-columns: 1fr; }
            .cat-btn { padding: 8px 14px; font-size: 0.8em; }
        }
    </style>
</head>
<body>

    <div class="header-top">
        <span class="discount-badge">🔥 FRETE GRÁTIS</span> em compras acima de R$ 49 na Shopee!
    </div>

    <header>
        <div class="logo-icon">🏊‍♂️</div>
        <div class="logo-text">Tomazela Piscinas</div>
        <p class="tagline">PRODUTOS SELECIONADOS POR QUEM ENTENDE DE PISCINA</p>
        <div class="social-pills" id="socialPills"></div>
    </header>

    <div class="category-nav">
        <button class="cat-btn active" onclick="window.filtrar('all')">🏷️ Todos</button>
        <button class="cat-btn" onclick="window.filtrar('tratamento')">🧪 Tratamento</button>
        <button class="cat-btn" onclick="window.filtrar('limpeza')">🧹 Limpeza</button>
        <button class="cat-btn" onclick="window.filtrar('acessorios')">🔧 Acessórios</button>
        <button class="cat-btn" onclick="window.filtrar('capa')">🛡️ Capas</button>
    </div>

    <div class="container">
        <div class="products-grid" id="productsContainer">
            <div class="loading-spinner">
                <div class="spin"></div>
                <p>Carregando produtos...</p>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-logo">🏊 Tomazela Piscinas</div>
        <p>Links de afiliado Shopee • Comprando aqui você ajuda o canal!</p>
        <p class="credits">© 2024 Tomazela Piscinas</p>
    </footer>

    <a href="login.html" class="admin-entry" title="Painel Admin">⚙️</a>

    <script type="module">
        import { db, produtosCollection, linksDoc, onSnapshot, orderBy, query, getDoc } from './js/firebase-config.js';

        let todosProdutos = [];
        let filtroAtual = 'all';

        // Carregar links sociais
        getDoc(linksDoc).then(docSnap => {
            if (docSnap.exists()) {
                const d = docSnap.data();
                const container = document.getElementById('socialPills');
                let html = '';
                if (d.tiktok) html += `<a href="${d.tiktok}" target="_blank" class="social-pill pill-tiktok">🎵 TikTok</a>`;
                if (d.whatsapp) html += `<a href="${d.whatsapp}" target="_blank" class="social-pill pill-whatsapp">💬 WhatsApp</a>`;
                if (d.instagram) html += `<a href="${d.instagram}" target="_blank" class="social-pill pill-instagram">📷 Instagram</a>`;
                container.innerHTML = html;
            }
        });

        // Carregar produtos em tempo real
        const q = query(produtosCollection, orderBy('createdAt', 'desc'));
        onSnapshot(q, snapshot => {
            todosProdutos = [];
            snapshot.forEach(docSnap => {
                todosProdutos.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderizar();
        }, error => {
            document.getElementById('productsContainer').innerHTML = `
                <div class="empty-state">
                    <div class="icon">⚠️</div>
                    <h3>Erro ao carregar</h3>
                    <p>Verifique a configuração do Firebase.</p>
                </div>`;
        });

        function renderizar() {
            const container = document.getElementById('productsContainer');
            const filtrados = filtroAtual === 'all' 
                ? todosProdutos 
                : todosProdutos.filter(p => p.category === filtroAtual);

            if (todosProdutos.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>Nenhum produto ainda</h3>
                        <p>O administrador ainda não cadastrou produtos.</p>
                    </div>`;
                return;
            }

            if (filtrados.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔍</div>
                        <h3>Nenhum produto nesta categoria</h3>
                        <p>Tente outra categoria.</p>
                    </div>`;
                return;
            }

            container.innerHTML = filtrados.map(p => {
                const temDesconto = p.oldPrice && p.oldPrice.trim() !== '';
                const temVideo = p.video && p.video.trim() !== '';
                
                let media = '';
                if (temVideo) {
                    media = `<video autoplay muted loop playsinline><source src="${p.video}" type="video/mp4"></video>
                             <span class="video-tag">🎬</span>`;
                } else if (p.image) {
                    media = `<img src="${p.image}" alt="${p.name}" loading="lazy"
                                  onerror="this.src='https://via.placeholder.com/500x300/006994/ffffff?text=Produto'">`;
                } else {
                    media = `<img src="https://via.placeholder.com/500x300/006994/ffffff?text=Sem+imagem" alt="${p.name}">`;
                }

                return `
                    <div class="product-card">
                        <div class="product-media">
                            ${media}
                            ${temDesconto ? '<span class="discount-tag">OFERTA</span>' : ''}
                        </div>
                        <div class="product-body">
                            <div class="product-name">${p.name}</div>
                            <div class="product-desc">${p.description}</div>
                            <div class="price-row">
                                <span class="current-price">${p.price}</span>
                                ${temDesconto ? `<span class="old-price">${p.oldPrice}</span>` : ''}
                            </div>
                            <a href="${p.link}" target="_blank" rel="noopener" class="btn-buy">
                                🛒 Comprar na Shopee
                            </a>
                        </div>
                    </div>`;
            }).join('');
        }

        window.filtrar = function(cat) {
            filtroAtual = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            const idx = cat === 'all' ? 0 : cat === 'tratamento' ? 1 : cat === 'limpeza' ? 2 : cat === 'acessorios' ? 3 : 4;
            const btns = document.querySelectorAll('.cat-btn');
            if (btns[idx]) btns[idx].classList.add('active');
            renderizar();
        };
    </script>
</body>
</html>
